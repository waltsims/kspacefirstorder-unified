name: CI (multi-platform)

on:
  workflow_dispatch:
  push:
    branches: [ main, develop, ci-multi-platform-experiments ]
  pull_request:
    branches: [ main, ci-multi-platform-experiments ]
  # Make the workflow callable from release-on-tag.yml so the build matrix
  # isn't duplicated. No effect on push/PR-triggered runs.
  workflow_call: {}

# Single source of truth for the vcpkg pin used by every job that
# needs vcpkg (currently windows-cuda and windows-openmp). Bumping
# the pin only requires editing this one line; both Windows jobs
# inherit the value automatically.
env:
  VCPKG_COMMIT: 271a5b8850aa50f9a40269cbf3cf414b36e333d6

jobs:
  linux-openmp:
    # Pin to Ubuntu 22.04 (glibc 2.35) so the binary remains compatible with
    # Ubuntu 22.04 LTS, Debian 12, RHEL 9, Colab, and similar — a bump to
    # ubuntu-latest (24.04, glibc 2.39) broke v1.4.0 for these targets.
    # The check-linux-binary-deps.sh step below catches future regressions.
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libhdf5-dev libfftw3-dev
      - name: Configure (OpenMP, Linux)
        run: |
          set -euxo pipefail
          cmake -S repos/kspaceFirstOrder-openmp-linux -B build/openmp-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DHDF5_ROOT=/usr/lib/x86_64-linux-gnu/hdf5/serial \
            -DCMAKE_PREFIX_PATH="/usr/lib/x86_64-linux-gnu/hdf5/serial;/usr"
      - name: Build (OpenMP, Linux)
        run: |
          set -euxo pipefail
          cmake --build build/openmp-linux --parallel "$(nproc)"
      - name: Smoke test (Linux)
        run: |
          set -euxo pipefail
          cd build/openmp-linux
          chmod +x ./kspaceFirstOrder-OMP
          # Write --help to a file first, then take the first 40 lines for the
          # log. If we piped directly into `head -n 40`, head would close the
          # pipe after reading the 40th line; the binary would get SIGPIPE on
          # its next write and exit 141, which `pipefail` would then promote
          # to a smoke-test failure even though --help worked.
          ./kspaceFirstOrder-OMP --help > /tmp/kspaceFirstOrder-OMP-help.txt
          head -n 40 /tmp/kspaceFirstOrder-OMP-help.txt

      - name: Verify static linkage (OpenMP, Linux)
        run: scripts/check-linux-binary-deps.sh build/openmp-linux/kspaceFirstOrder-OMP omp

      - name: Upload artifacts
        uses: actions/upload-artifact@v4.3.1
        with:
          name: kspaceFirstOrder-openmp-linux-ubuntu-latest
          path: |
            build/openmp-linux/kspaceFirstOrder-*
          if-no-files-found: error

      - name: Build diagnostics
        if: failure()
        run: |
          echo "Build failed for OpenMP (Linux)"
          if [ -f build/openmp-linux/CMakeFiles/CMakeError.log ]; then
            echo "----- CMakeError.log -----"
            cat build/openmp-linux/CMakeFiles/CMakeError.log
          fi
          if [ -f build/openmp-linux/CMakeFiles/CMakeOutput.log ]; then
            echo "----- CMakeOutput.log -----"
            cat build/openmp-linux/CMakeFiles/CMakeOutput.log
          fi
          echo "CPU info:"; lscpu || true
          echo "FFTW libs:"; ldconfig -p | grep -i fftw || true
          echo "HDF5 libs:"; ldconfig -p | grep -i hdf5 || true

  linux-cuda:
    # Pin to Ubuntu 22.04 (glibc 2.35); see linux-openmp above for rationale.
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        cuda-version: ['12.2.0', '13.0.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config cmake \
            gcc-12 g++-12 \
            libhdf5-dev zlib1g-dev libfftw3-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-12 120
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-12 120
          sudo update-alternatives --set gcc /usr/bin/gcc-12
          sudo update-alternatives --set g++ /usr/bin/g++-12
          gcc --version
          g++ --version

      - name: Install CUDA Toolkit (Linux)
        uses: N-Storm/cuda-toolkit@v0.2.27m
        with:
          cuda: ${{ matrix.cuda-version }}
          use-github-cache: true
          method: local
          linux-local-args: '["--toolkit"]'
          use-local-cache: false
          log-file-suffix: ${{ matrix.cuda-version }}.log.txt

      - name: Configure (CUDA, Linux)
        run: |
          set -euxo pipefail
          export CC=/usr/bin/gcc-12 CXX=/usr/bin/g++-12 CUDAHOSTCXX=/usr/bin/g++-12
          cmake -S repos/kspaceFirstOrder-cuda-linux -B build/cuda-linux \
            -DCMAKE_BUILD_TYPE=Release \
            -DKSPACE_CPU_ARCH=native \
            -DHDF5_ROOT=/usr/lib/x86_64-linux-gnu/hdf5/serial \
            -DCUDAToolkit_ROOT=/usr/local/cuda

      - name: Build (CUDA, Linux)
        run: |
          set -euxo pipefail
          cmake --build build/cuda-linux --parallel "$(nproc)"

      - name: Verify static linkage (CUDA, Linux)
        run: scripts/check-linux-binary-deps.sh build/cuda-linux/kspaceFirstOrder-CUDA cuda

      - name: Upload artifacts (CUDA Linux)
        uses: actions/upload-artifact@v4.3.1
        with:
          name: kspaceFirstOrder-cuda-linux-${{ matrix.cuda-version }}
          path: |
            build/cuda-linux/kspaceFirstOrder-CUDA
          if-no-files-found: error

      - name: Build diagnostics (CUDA Linux)
        if: failure()
        run: |
          echo "CUDA nvcc version:"; if command -v nvcc; then nvcc --version; fi
          echo "HDF5 libs:"; ldconfig -p | grep -i hdf5 || true
  macos-openmp:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install dependencies (Homebrew)
        run: |
          set -euxo pipefail
          export HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1
          brew install cmake hdf5 fftw libomp zlib
          brew link --overwrite --force libomp

      - name: Configure (OpenMP, macOS)
        run: |
          set -euxo pipefail
          SRC=repos/kspaceFirstOrder-openmp-darwin
          BUILD=build/openmp-darwin
          BREW_PREFIX="$(brew --prefix)"
          cmake -S "$SRC" -B "$BUILD" \
            -DCMAKE_BUILD_TYPE=Release \
            -DHOMEBREW_PREFIX="$BREW_PREFIX"

      - name: Build (OpenMP, macOS)
        run: |
          set -euxo pipefail
          cmake --build build/openmp-darwin --parallel $(sysctl -n hw.ncpu)

      - name: Smoke test (macOS)
        run: |
          set -e
          ./build/openmp-darwin/kspaceFirstOrder-OMP --help

      - name: Upload artifacts (macOS)
        uses: actions/upload-artifact@v4.3.1
        with:
          name: kspaceFirstOrder-openmp-darwin-macos-latest
          path: |
            build/openmp-darwin/kspaceFirstOrder-OMP
          if-no-files-found: error

      - name: Build diagnostics (macOS)
        if: failure()
        run: |
          brew --prefix
          brew list --versions hdf5 fftw libomp zlib || true
          cmake --version

  windows-cuda:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cuda-version: ['13.0.0']
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up MSBuild
        uses: microsoft/setup-msbuild@v2.0.0

      - name: Install CUDA Toolkit (Windows)
        uses: N-Storm/cuda-toolkit@v0.2.27m
        with:
          cuda: ${{ matrix.cuda-version }}
          use-github-cache: true
          method: local
          linux-local-args: '["--toolkit"]'
          use-local-cache: false
          sub-packages: '[]'
          non-cuda-sub-packages: '[]'
          log-file-suffix: ${{ matrix.cuda-version }}.log.txt

      - name: Register CUDA MSBuild customizations
        shell: pwsh
        run: |
          $vsPath = & "${Env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $vsPath) {
            throw "Failed to locate Visual Studio installation"
          }
          & "$vsPath\Common7\Tools\VsDevCmd.bat" -no_logo -arch=amd64 -host_arch=amd64 | Out-Null
          if (-not $env:CUDA_PATH) {
            throw "CUDA_PATH is not set after toolkit installation"
          }
          if (-not $env:VCTargetsPath) {
            $vcTargets = Join-Path $vsPath 'MSBuild/Microsoft/VC/v170'
            if (-not (Test-Path $vcTargets)) {
              throw "Unable to determine VCTargetsPath under $vsPath"
            }
            $env:VCTargetsPath = $vcTargets
          }
          $src = Join-Path $env:CUDA_PATH 'extras\visual_studio_integration\MSBuildExtensions'
          $dest = Join-Path $env:VCTargetsPath 'BuildCustomizations'
          Write-Host "Copying CUDA build customizations from $src to $dest"
          if (-not (Test-Path $src)) {
            throw "Expected MSBuildExtensions directory not found at $src"
          }
          New-Item -ItemType Directory -Path $dest -Force | Out-Null
          Copy-Item -Path (Join-Path $src 'CUDA*.props') -Destination $dest -Force
          Copy-Item -Path (Join-Path $src 'CUDA*.targets') -Destination $dest -Force

      - name: Install vcpkg and dependencies (HDF5 + zlib)
        shell: pwsh
        run: |
          $vcpkgRoot = "$env:RUNNER_TEMP\vcpkg"
          git clone --depth 1 https://github.com/microsoft/vcpkg $vcpkgRoot
          git -C $vcpkgRoot fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C $vcpkgRoot checkout $env:VCPKG_COMMIT
          Write-Host "Bootstrapping vcpkg at: $vcpkgRoot"
          & "$vcpkgRoot\bootstrap-vcpkg.bat" -disableMetrics
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg bootstrap failed with exit code $LASTEXITCODE"
          }
          & "$vcpkgRoot\vcpkg.exe" install hdf5[szip]:x64-windows zlib:x64-windows
          echo "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append

      # Removed legacy alias step; project links vcpkg libs directly

      - name: Configure (CUDA, Windows)
        shell: pwsh
        env:
          CMAKE_GENERATOR: "Visual Studio 17 2022"
          CMAKE_GENERATOR_PLATFORM: x64
          CMAKE_GENERATOR_TOOLSET: host=x64
          VCPKG_ROOT: ${{ env.VCPKG_ROOT }}
        run: |
          $env:PATH = "$env:VCPKG_ROOT;${env:PATH}"
          cmake -S repos/kspaceFirstOrder-cuda-windows -B build/cuda-windows `
            -DCMAKE_BUILD_TYPE=Release `
            -DKSPACE_CPU_ARCH=avx2 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build (CUDA, Windows)
        shell: pwsh
        run: |
          cmake --build build/cuda-windows --config Release -- /m

      - name: Collect runtime DLLs (CUDA Windows)
        # Ship the CUDA exe with every non-system runtime it needs on a
        # clean Windows install: vcpkg HDF5/zlib/szip deps, MSVC CRT, and
        # CUDA runtime DLLs from the installed toolkit.
        shell: pwsh
        run: |
          $dest = "build/cuda-windows/Release"
          if (-not (Test-Path "$dest/kspaceFirstOrder-CUDA.exe")) {
            throw "CUDA exe not found in expected artifact directory: $dest"
          }

          $vcpkgCandidates = @(
            "$env:VCPKG_ROOT/installed/x64-windows/bin",
            "build/cuda-windows/vcpkg_installed/x64-windows/bin"
          )
          $vcpkgBin = $vcpkgCandidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $vcpkgBin) {
            throw "No vcpkg runtime bin directory found. Checked: $($vcpkgCandidates -join ', ')"
          }
          Copy-Item "$vcpkgBin/*.dll" $dest -Force -Verbose

          $redistRoot = $env:VCToolsRedistDir
          if (-not $redistRoot) {
            $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" `
              -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
              -property installationPath
            if (-not $vsPath) {
              throw "Unable to locate Visual Studio installation with VC tools"
            }
            $redistRoot = Join-Path $vsPath "VC/Redist/MSVC"
          }

          if (Test-Path (Join-Path $redistRoot "x64")) {
            $redistX64 = Join-Path $redistRoot "x64"
          } else {
            $redistVersion = Get-ChildItem -Path $redistRoot -Directory |
              Where-Object { $_.Name -match '^\d+\.\d+\.\d+$' } |
              Sort-Object Name -Descending |
              Select-Object -First 1
            if (-not $redistVersion) {
              throw "No MSVC redistributable version directory found under $redistRoot"
            }
            $redistX64 = Join-Path $redistVersion.FullName "x64"
          }

          Get-ChildItem -Path $redistX64 -Filter "Microsoft.*.CRT" -Directory -ErrorAction SilentlyContinue |
            ForEach-Object { Copy-Item "$($_.FullName)/*.dll" $dest -Force -Verbose }

          if (-not $env:CUDA_PATH) {
            throw "CUDA_PATH is not set; cannot collect CUDA runtime DLLs"
          }
          $cudaBin = Join-Path $env:CUDA_PATH "bin"
          foreach ($pattern in @("cudart64_*.dll", "cufft64_*.dll")) {
            $matches = Get-ChildItem -Path $cudaBin -Filter $pattern -File -ErrorAction SilentlyContinue
            if (-not $matches) {
              throw "No CUDA DLLs matched '$pattern' in $cudaBin"
            }
            $matches | Copy-Item -Destination $dest -Force -Verbose
          }

          Write-Host "=== Final CUDA artifact contents ==="
          Get-ChildItem "$dest/*.exe", "$dest/*.dll" | Select-Object Name, Length

      - name: Smoke test (CUDA Windows)
        shell: pwsh
        run: |
          $help = "$env:RUNNER_TEMP/kspaceFirstOrder-CUDA-help.txt"
          & ".\build\cuda-windows\Release\kspaceFirstOrder-CUDA.exe" --help > $help
          if ($LASTEXITCODE -ne 0) {
            throw "CUDA --help smoke test failed with exit code $LASTEXITCODE"
          }
          Get-Content $help -TotalCount 20

      - name: Upload artifacts (CUDA Windows)
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: kspaceFirstOrder-cuda-windows-${{ matrix.cuda-version }}
          path: |
            build/cuda-windows/Release/kspaceFirstOrder-CUDA.exe
            build/cuda-windows/Release/*.dll
          if-no-files-found: error

      - name: Build diagnostics (CUDA Windows)
        if: failure()
        shell: pwsh
        run: |
          nvcc --version || $true
          & msbuild -version || $true
          Get-ChildItem -Recurse -Filter *.targets "C:\Program Files (x86)\Microsoft Visual Studio" -ErrorAction SilentlyContinue | Select-Object -First 5 | ForEach-Object { $_.FullName }

  windows-openmp:
    runs-on: windows-latest
    env:
      VCPKG_ROOT: C:\vcpkg
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup MSVC dev env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install vcpkg (manifest mode)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT }}
          # run-vcpkg@v11 handles binary caching internally via GitHub
          # Actions cache (keyed off vcpkg commit + vcpkg.json hash), so
          # the previous explicit `actions/cache@v4` step here was
          # redundant — it cached the same paths twice with slightly
          # different keys, racing the action's own cache.

      - name: Configure (OpenMP, Windows)
        run: >
          cmake -S repos/kspaceFirstOrder-openmp-windows -B build/openmp-windows
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DUSE_MKL=OFF
          -DENABLE_OPENMP=ON
          -DARCH=avx2

      - name: Build (OpenMP, Windows)
        run: cmake --build build/openmp-windows --parallel

      - name: Collect runtime DLLs (OpenMP Windows)
        # The v1.4 OMP build switched to MSVC + VCOMP + FFTW (vcpkg), so the
        # exe depends on FFTW + HDF5 (+ transitive deps) from vcpkg and on
        # MSVC's VCRUNTIME140_1.dll + VCOMP140.dll from the Visual C++
        # redistributable. Ship them all alongside the .exe so users on a
        # clean Windows install don't get STATUS_DLL_NOT_FOUND.
        shell: pwsh
        run: |
          $dest = "build/openmp-windows"
          # vcpkg-installed runtime DLLs (HDF5 + zlib + szip + fftw3f + transitives)
          $vcpkgBin = "build/openmp-windows/vcpkg_installed/x64-windows/bin"
          if (Test-Path $vcpkgBin) {
            Copy-Item "$vcpkgBin\*.dll" $dest -Force -Verbose
          } else {
            throw "vcpkg_installed bin not found at $vcpkgBin"
          }
          # MSVC redistributable DLLs (CRT + OpenMP)
          $redist = $env:VCToolsRedistDir
          if (-not $redist) { throw "VCToolsRedistDir not set; MSVC env not activated" }
          foreach ($pattern in @("Microsoft.*.CRT", "Microsoft.*.OPENMP")) {
            Get-ChildItem -Path "$redist\x64" -Filter $pattern -Directory -ErrorAction SilentlyContinue | ForEach-Object {
              Copy-Item "$($_.FullName)\*.dll" $dest -Force -Verbose
            }
          }
          Write-Host "=== Final artifact contents ==="
          Get-ChildItem "$dest\*.exe", "$dest\*.dll" | Select-Object Name, Length

      - name: Smoke test (OpenMP Windows)
        shell: pwsh
        run: |
          & ".\build\openmp-windows\kspaceFirstOrder-OMP.exe" --help | Select-Object -First 20

      - name: Upload artifacts (OpenMP Windows)
        if: success()
        uses: actions/upload-artifact@v4.3.1
        with:
          name: kspaceFirstOrder-openmp-windows-windows-latest
          path: |
            build/openmp-windows/kspaceFirstOrder-OMP.exe
            build/openmp-windows/*.dll
          if-no-files-found: error

      - name: Build diagnostics (OpenMP Windows)
        if: failure()
        shell: pwsh
        run: |
          cl.exe || $true
          if (Test-Path 'build/openmp-windows/CMakeFiles/CMakeError.log') {
            Write-Host '----- CMakeError.log -----'
            Get-Content 'build/openmp-windows/CMakeFiles/CMakeError.log'
          }
          if (Test-Path 'build/openmp-windows/CMakeFiles/CMakeOutput.log') {
            Write-Host '----- CMakeOutput.log -----'
            Get-Content 'build/openmp-windows/CMakeFiles/CMakeOutput.log'
          }
