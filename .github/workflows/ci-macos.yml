name: CI - macOS

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-openmp:
    runs-on: macos-latest
    name: macOS - OpenMP Backend
    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        brew install \
          cmake \
          pkg-config \
          hdf5 \
          fftw \
          libomp \
          gcc

    - name: Configure CMake (OpenMP Only)
      run: |
        # Use GCC for better OpenMP support
        echo "Using GCC with Homebrew libomp:"
        which gcc g++
        gcc --version | head -1
        g++ --version | head -1

        # Set compiler environment variables
        export CC=gcc
        export CXX=g++

        # Configure with OpenMP enabled
        cmake -B build \
          -DUSE_CUDA=OFF \
          -DUSE_OPENMP=ON \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix hdf5);$(brew --prefix fftw);$(brew --prefix libomp)"
    
    - name: Build
      run: cmake --build build -j$(sysctl -n hw.ncpu) --verbose
        
    - name: Build diagnostics
      if: failure()
      run: |
        echo "Build failed, showing CMake cache..."
        cat build/CMakeCache.txt | grep -E "(OpenMP|FFTW|HDF5)" || true
        echo "Showing CMake error log..."
        cat build/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
        echo "Showing dependency locations..."
        brew list --verbose hdf5 fftw libomp
    
    - name: Test executable exists
      run: test -f build/src/kspaceFirstOrder
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kspaceFirstOrder-macos-openmp
        path: build/src/kspaceFirstOrder