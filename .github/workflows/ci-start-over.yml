name: CI (start-over)

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  linux-openmp:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential cmake pkg-config \
            libhdf5-dev libfftw3-dev
      - name: Prepare wrapper Makefile (no source changes)
        run: |
          # Create wrapper and set a literal space as recipe prefix, then include upstream Makefile
          cd repos/kspaceFirstOrder-openmp-linux
          printf '.RECIPEPREFIX := %b\ninclude Makefile\n' ' ' > Makefile.ci
      - name: Build (OpenMP, Linux)
        run: |
          set -euxo pipefail
          cd repos/kspaceFirstOrder-openmp-linux
          make -f Makefile.ci -j$(nproc) \
            LINKING=DYNAMIC COMPILER=GNU \
            FFT_DIR=/usr HDF5_DIR=/usr ZLIB_DIR=/usr SZIP_DIR=/usr

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kspaceFirstOrder-openmp-linux-ubuntu-latest
          path: |
            repos/kspaceFirstOrder-openmp-linux/kspaceFirstOrder-*
          if-no-files-found: error

      - name: Build diagnostics
        if: failure()
        run: |
          echo "Build failed for OpenMP (Linux)"
          echo "CPU info:"; lscpu || true
          echo "FFTW libs:"; ldconfig -p | grep -i fftw || true
          echo "HDF5 libs:"; ldconfig -p | grep -i hdf5 || true
