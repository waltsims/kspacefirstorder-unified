name: windows-msvc

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      VCPKG_ROOT: C:\\vcpkg

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSVC dev env
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: 9f2f1fcd5b9f9d4a8d3a1b9b2f1a3d55a2a5e7b2

      - name: Configure (CMake + vcpkg toolchain)
        run: >
          cmake -S . -B build
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_TOOLCHAIN_FILE=${{ env.VCPKG_ROOT }}\scripts\buildsystems\vcpkg.cmake
          -DUSE_MKL=OFF
          -DENABLE_OPENMP=ON
          -DARCH=avx2

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Package artifact
        run: |
          mkdir artifact
          copy build\kspaceFirstOrder-OMP.exe artifact\
        shell: cmd

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: kwave-omp-windows
          path: artifact/
