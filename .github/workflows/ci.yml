name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            name: linux-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "build-essential cmake pkg-config libhdf5-dev libfftw3-dev"
            setup_cuda: false
          # - os: ubuntu-latest
          #   name: linux-cuda
          #   cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
          #   dependencies: "build-essential cmake pkg-config libhdf5-dev"
          #   setup_cuda: true

          # macOS builds
          - os: macos-latest
            name: macos-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "cmake pkg-config hdf5 fftw libomp"
            setup_cuda: false

          # Windows builds
          - os: windows-latest
            name: windows-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "cmake"
            setup_cuda: false
            needs_fftw: true
            needs_hdf5: true
          # Windows CUDA build (compile/link only on hosted runners; no GPU runtime)
          # - os: windows-latest
          #   name: windows-cuda
          #   cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
          #   dependencies: "cmake"
          #   setup_cuda: true
          #   needs_fftw: false
          #   needs_hdf5: true

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - ${{ matrix.name }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install CUDA Toolkit (Linux only)
      if: matrix.setup_cuda && runner.os == 'Linux'
      uses: N-Storm/cuda-toolkit@v0.2.27m
      with:
        cuda: '13.0.0'
        use-github-cache: false

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.dependencies }}

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ${{ matrix.dependencies }} gcc

    - name: Install dependencies (Windows)
      if: runner.os == 'Windows'
      run: choco install ${{ matrix.dependencies }} -y

    - name: Install HDF5 (Windows)
      if: runner.os == 'Windows' && matrix.needs_hdf5
      shell: powershell
      run: |
        $hdf5_url = "https://support.hdfgroup.org/releases/hdf5/v1_14/v1_14_6/downloads/hdf5-1.14.6-win-vs2022_cl.zip"
        Invoke-WebRequest -Uri $hdf5_url -OutFile hdf5.zip
        7z x hdf5.zip -o"C:\"
        # Find the actual HDF5 installation directory
        $hdf5_dirs = Get-ChildItem -Path "C:\" -Name -Directory | Where-Object { $_ -like "*HDF*" -or $_ -like "*hdf*" }
        if ($hdf5_dirs.Count -eq 0) {
          Write-Error "No HDF5 directory found after extraction"
          exit 1
        }
        $hdf5_path = "C:\" + $hdf5_dirs[0]
        Write-Host "Found HDF5 directory: $hdf5_path"
        echo "HDF5_ROOT=$hdf5_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        # Only set HDF5_DIR if cmake directory exists
        if (Test-Path "$hdf5_path\cmake") {
            echo "HDF5_DIR=$hdf5_path\cmake" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        }
        echo "$hdf5_path\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "$hdf5_path\lib" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

    - name: Install FFTW (Windows)
      if: runner.os == 'Windows' && matrix.needs_fftw
      shell: powershell
      run: |
        $fftw_url = "ftp://ftp.fftw.org/pub/fftw/fftw-3.3.5-dll64.zip"
        Invoke-WebRequest -Uri $fftw_url -OutFile fftw.zip
        7z x fftw.zip -o"C:\fftw"
        $fftw_path = "C:\fftw"
        echo "FFTW_ROOT=$fftw_path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        echo "$fftw_path" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        echo "Checking FFTW installation..."
        ls $fftw_path

    # Install CUDA Toolkit on Windows hosted runners using NVIDIA's network installer.
    # This enables building CUDA code (nvcc and headers) but does NOT provide a GPU for runtime tests.
    # For GPU runtime testing, use a self-hosted Windows runner with NVIDIA drivers.
    - name: Install CUDA 13.0 on Windows
      if: matrix.setup_cuda && runner.os == 'Windows'
      shell: bash
      timeout-minutes: 30
      run: |
        set -e
        curl -Lo cuda_13.0.0_windows_network.exe https://developer.download.nvidia.com/compute/cuda/13.0.0/network_installers/cuda_13.0.0_windows_network.exe
        powershell -Command "Start-Process -FilePath cuda_13.0.0_windows_network.exe -ArgumentList '-s','-n' -Wait"
        rm -f ./cuda_13.0.0_windows_network.exe
        echo "CUDA_PATH=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0" >> $GITHUB_ENV
        echo "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0\\bin" >> $GITHUB_PATH

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Using Homebrew GCC with OpenMP support:"
        # Set CC and CXX to Homebrew's GCC
        export CC=$(brew --prefix gcc)/bin/gcc-15
        export CXX=$(brew --prefix gcc)/bin/g++-15
        which gcc g++
        $CC --version | head -1
        $CXX --version | head -1

        cmake -B build \
          ${{ matrix.cmake_flags }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_C_COMPILER=$(brew --prefix gcc)/bin/gcc-15 \
          -DCMAKE_CXX_COMPILER=$(brew --prefix gcc)/bin/g++-15

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: |
        echo "HDF5_ROOT: $HDF5_ROOT"
        echo "HDF5_DIR: $HDF5_DIR"
        echo "FFTW_ROOT: $FFTW_ROOT"
        echo "Checking HDF5 installation..."
        ls -la "$HDF5_ROOT" || echo "HDF5_ROOT directory not found"
        echo "HDF5_ROOT contents:"
        ls -la "$HDF5_ROOT" || echo "Failed to list HDF5_ROOT"
        echo "Checking subdirectories:"
        ls -la "$HDF5_ROOT/lib" 2>/dev/null || echo "No lib directory"
        ls -la "$HDF5_ROOT/include" 2>/dev/null || echo "No include directory"
        ls -la "$HDF5_ROOT/cmake" 2>/dev/null || echo "No cmake directory"
        ls -la "$HDF5_ROOT/bin" 2>/dev/null || echo "No bin directory"
        echo "Checking for HDF5 libraries..."
        find "$HDF5_ROOT" -name "*.lib" 2>/dev/null | head -10 || echo "No .lib files found"
        echo "Checking for HDF5 headers..."
        find "$HDF5_ROOT" -name "hdf5.h" 2>/dev/null | head -5 || echo "No hdf5.h found"
        cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$HDF5_ROOT;$FFTW_ROOT"

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          cmake --build build -j$(nproc) --verbose
        else
          cmake --build build -j$(sysctl -n hw.ncpu) --verbose
        fi
      shell: bash

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release -j --verbose
    
    - name: Build diagnostics
      if: failure()
      shell: bash
      run: |
        echo "Build failed, showing CMake cache..."
        cat build/CMakeCache.txt | grep -E "(OpenMP|FFTW|HDF5|CUDA)" || true
        echo "Showing CMake error log..."
        cat build/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
    
    - name: Test executable exists (Unix)
      if: runner.os != 'Windows'
      run: test -f build/src/Release/kspaceFirstOrder

    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: Test-Path build/src/Release/kspaceFirstOrder.exe
      shell: powershell
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kspaceFirstOrder-${{ matrix.name }}
        path: |
          build/src/Release/kspaceFirstOrder
          build/src/Release/kspaceFirstOrder.exe
        if-no-files-found: ignore