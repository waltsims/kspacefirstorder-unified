name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            name: linux-openmp
            preset: linux-openmp
            setup_cuda: false
          # - os: ubuntu-latest
          #   name: linux-cuda
          #   cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
          #   dependencies: "build-essential cmake pkg-config libhdf5-dev"
          #   setup_cuda: true

          # macOS builds
          - os: macos-latest
            name: macos-openmp
            preset: macos-openmp
            setup_cuda: false

          # Windows builds
          - os: windows-latest
            name: windows-openmp
            preset: windows-openmp
            setup_cuda: false
            needs_fftw: false
            needs_hdf5: false
          # Windows CUDA build (compile/link only on hosted runners; no GPU runtime)
          # - os: windows-latest
          #   name: windows-cuda
          #   cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
          #   dependencies: "cmake"
          #   setup_cuda: true
          #   needs_fftw: false
          #   needs_hdf5: true

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - ${{ matrix.name }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install CUDA Toolkit (Linux only)
      if: matrix.setup_cuda && runner.os == 'Linux'
      uses: N-Storm/cuda-toolkit@v0.2.27m
      with:
        cuda: '13.0.0'
        use-github-cache: false

    - name: Bootstrap vcpkg (Linux/macOS)
      if: runner.os != 'Windows'
      shell: bash
      run: |
        set -euxo pipefail
        VCPKG_ROOT="$GITHUB_WORKSPACE/third-party/vcpkg"
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
        "$VCPKG_ROOT/bootstrap-vcpkg.sh" -disableMetrics

    - name: Bootstrap vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        $vcpkgPath = Join-Path $env:GITHUB_WORKSPACE 'third-party\vcpkg'
        & "$vcpkgPath\bootstrap-vcpkg.bat" -disableMetrics
        echo "VCPKG_ROOT=$vcpkgPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: Cache vcpkg artifacts
      uses: actions/cache@v4
      with:
        path: |
          third-party/vcpkg/installed
          third-party/vcpkg/downloads
        key: vcpkg-${{ runner.os }}-${{ matrix.name }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-${{ runner.os }}-${{ matrix.name }}-

    - name: vcpkg install (manifest mode)
      shell: bash
      run: |
        set -euxo pipefail
        vcpkg_bin="$VCPKG_ROOT/vcpkg"
        if [ "$RUNNER_OS" = "Windows" ]; then vcpkg_bin="$VCPKG_ROOT\\vcpkg.exe"; fi
        triplet="x64-linux"
        if [ "$RUNNER_OS" = "macOS" ]; then triplet="x64-osx"; fi
        if [ "$RUNNER_OS" = "Windows" ]; then triplet="x64-windows"; fi
        "$vcpkg_bin" install --triplet "$triplet"

    

    # Install CUDA Toolkit on Windows hosted runners using NVIDIA's network installer.
    # This enables building CUDA code (nvcc and headers) but does NOT provide a GPU for runtime tests.
    # For GPU runtime testing, use a self-hosted Windows runner with NVIDIA drivers.
    - name: Install CUDA 13.0 on Windows
      if: matrix.setup_cuda && runner.os == 'Windows'
      shell: bash
      timeout-minutes: 30
      run: |
        set -e
        curl -Lo cuda_13.0.0_windows_network.exe https://developer.download.nvidia.com/compute/cuda/13.0.0/network_installers/cuda_13.0.0_windows_network.exe
        powershell -Command "Start-Process -FilePath cuda_13.0.0_windows_network.exe -ArgumentList '-s','-n' -Wait"
        rm -f ./cuda_13.0.0_windows_network.exe
        echo "CUDA_PATH=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0" >> $GITHUB_ENV
        echo "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0\\bin" >> $GITHUB_PATH

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Using GCC with Homebrew libomp:"
        # Set CC and CXX to Homebrew's GCC
        export CC=$(brew --prefix gcc)/bin/gcc-15
        export CXX=$(brew --prefix gcc)/bin/g++-15
        which gcc g++
        $CC --version | head -1
        $CXX --version | head -1

        cmake -B build \
          ${{ matrix.cmake_flags }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_PREFIX_PATH="$(brew --prefix hdf5);$(brew --prefix fftw);$(brew --prefix libomp)" \
          -DHDF5_DIR="$(brew --prefix hdf5)/lib/cmake/hdf5" \
          -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON \
          -DHDF5_PREFER_PARALLEL=OFF

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON -DHDF5_PREFER_PARALLEL=OFF

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      run: cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_FIND_PACKAGE_PREFER_CONFIG=ON -DHDF5_PREFER_PARALLEL=OFF -DHDF5_DIR="${{ env.HDF5_DIR }}" -DCMAKE_PREFIX_PATH="${{ env.HDF5_ROOT }};${{ env.HDF5_DIR }};${{ env.HDF5_ROOT }}\lib\cmake\hdf5;${{ env.VCPKG_ROOT }}\installed\x64-windows;${{ env.FFTW_ROOT }}"

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          cmake --build build -j$(nproc) --verbose
        else
          cmake --build build -j$(sysctl -n hw.ncpu) --verbose
        fi
      shell: bash

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release -j --verbose
    
    - name: Build diagnostics
      if: failure()
      shell: bash
      run: |
        echo "Build failed, showing CMake cache..."
        cat build/CMakeCache.txt | grep -E "(OpenMP|FFTW|HDF5|CUDA)" || true
        echo "Showing CMake error log..."
        cat build/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
    
    - name: Test executable exists (Unix)
      if: runner.os != 'Windows'
      run: test -f build/src/Release/kspaceFirstOrder

    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: Test-Path build/src/Release/kspaceFirstOrder.exe
      shell: powershell
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kspaceFirstOrder-${{ matrix.name }}
        path: |
          build/src/Release/kspaceFirstOrder
          build/src/Release/kspaceFirstOrder.exe
        if-no-files-found: ignore
