name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux builds
          - os: ubuntu-latest
            name: linux-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "build-essential cmake pkg-config"
            setup_cuda: false
          - os: ubuntu-latest
            name: linux-cuda
            cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
            dependencies: "build-essential cmake pkg-config"
            setup_cuda: true

          # macOS builds
          - os: macos-latest
            name: macos-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "cmake pkg-config libomp"
            setup_cuda: false

          # Windows builds
          - os: windows-latest
            name: windows-openmp
            cmake_flags: "-DUSE_CUDA=OFF -DUSE_OPENMP=ON"
            dependencies: "cmake"
            setup_cuda: false
          # Windows CUDA build (compile/link only on hosted runners; no GPU runtime)
          - os: windows-latest
            name: windows-cuda
            cmake_flags: "-DUSE_CUDA=ON -DUSE_OPENMP=OFF"
            dependencies: "cmake"
            setup_cuda: true

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.os }} - ${{ matrix.name }}
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install CUDA Toolkit (Linux only)
      if: matrix.setup_cuda && runner.os == 'Linux'
      uses: N-Storm/cuda-toolkit@v0.2.27m
      with:
        cuda: '13.0.0'
        use-github-cache: false

    - name: Install dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y ${{ matrix.dependencies }}

    - name: Setup vcpkg (Linux)
      if: runner.os == 'Linux'
      run: |
        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics
        "$VCPKG_ROOT"/vcpkg install hdf5 fftw3[threads] --triplet x64-linux
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"

    - name: Install dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew install ${{ matrix.dependencies }} gcc

    - name: Setup vcpkg (macOS)
      if: runner.os == 'macOS'
      run: |
        VCPKG_ROOT="$RUNNER_TEMP/vcpkg"
        # Detect architecture to choose correct triplet (Apple Silicon vs Intel)
        if [ "$(uname -m)" = "arm64" ]; then
          VCPKG_TRIPLET=arm64-osx
        else
          VCPKG_TRIPLET=x64-osx
        fi
        git clone https://github.com/microsoft/vcpkg "$VCPKG_ROOT"
        "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics
        "$VCPKG_ROOT"/vcpkg install hdf5 fftw3[threads] --triplet "$VCPKG_TRIPLET"
        echo "VCPKG_ROOT=$VCPKG_ROOT" >> "$GITHUB_ENV"
        echo "VCPKG_TRIPLET=$VCPKG_TRIPLET" >> "$GITHUB_ENV"

    # Setup vcpkg on Windows for HDF5/FFTW (and toolchain integration)
    - name: Setup vcpkg (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $VCPKG_ROOT = Join-Path $env:RUNNER_TEMP "vcpkg"
        git clone https://github.com/microsoft/vcpkg $VCPKG_ROOT
        $env:VCPKG_ROOT = $VCPKG_ROOT
        & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat"
        & "$env:VCPKG_ROOT\vcpkg.exe" integrate install
        # Install required libraries
        & "$env:VCPKG_ROOT\vcpkg.exe" install hdf5:x64-windows fftw3:x64-windows getopt-win32:x64-windows
        "VCPKG_ROOT=$env:VCPKG_ROOT" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_ENV
        "$env:VCPKG_ROOT\installed\x64-windows\bin" | Out-File -Encoding utf8 -Append -FilePath $env:GITHUB_PATH

    # Install CUDA Toolkit on Windows hosted runners using NVIDIA's network installer.
    # This enables building CUDA code (nvcc and headers) but does NOT provide a GPU for runtime tests.
    # For GPU runtime testing, use a self-hosted Windows runner with NVIDIA drivers.
    - name: Install CUDA 13.0 on Windows
      if: matrix.setup_cuda && runner.os == 'Windows'
      shell: bash
      timeout-minutes: 30
      run: |
        set -e
        curl -Lo cuda_13.0.0_windows_network.exe https://developer.download.nvidia.com/compute/cuda/13.0.0/network_installers/cuda_13.0.0_windows_network.exe
        powershell -Command "Start-Process -FilePath cuda_13.0.0_windows_network.exe -ArgumentList '-s','-n' -Wait"
        rm -f ./cuda_13.0.0_windows_network.exe
        echo "CUDA_PATH=C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0" >> $GITHUB_ENV
        echo "C:\\Program Files\\NVIDIA GPU Computing Toolkit\\CUDA\\v13.0\\bin" >> $GITHUB_PATH

    - name: Configure CMake (macOS)
      if: runner.os == 'macOS'
      run: |
        echo "Using GCC with Homebrew libomp:"
        which gcc g++
        gcc --version | head -1
        g++ --version | head -1

        export CC=gcc
        export CXX=g++

        cmake -B build \
          ${{ matrix.cmake_flags }} \
          -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET"

    - name: Configure CMake (Linux)
      if: runner.os == 'Linux'
      run: |
        cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release \
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" \
          -DVCPKG_TARGET_TRIPLET=x64-linux

    - name: Configure CMake (Windows)
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        cmake -B build ${{ matrix.cmake_flags }} -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows

    - name: Build (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "$RUNNER_OS" = "Linux" ]; then
          cmake --build build -j$(nproc) --verbose
        else
          cmake --build build -j$(sysctl -n hw.ncpu) --verbose
        fi
      shell: bash

    - name: Build (Windows)
      if: runner.os == 'Windows'
      run: cmake --build build --config Release -j --verbose
    
    - name: Build diagnostics
      if: failure()
      shell: bash
      run: |
        echo "Build failed, showing CMake cache..."
        cat build/CMakeCache.txt | grep -E "(OpenMP|FFTW|HDF5|CUDA)" || true
        echo "Showing CMake error log..."
        cat build/CMakeFiles/CMakeError.log 2>/dev/null || echo "No CMakeError.log found"
    
    - name: Test executable exists (Unix)
      if: runner.os != 'Windows'
      run: test -f build/src/Release/kspaceFirstOrder

    - name: Test executable exists (Windows)
      if: runner.os == 'Windows'
      run: Test-Path build/src/Release/kspaceFirstOrder.exe
      shell: powershell
    
    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kspaceFirstOrder-${{ matrix.name }}
        path: |
          build/src/Release/kspaceFirstOrder
          build/src/Release/kspaceFirstOrder.exe
        if-no-files-found: ignore